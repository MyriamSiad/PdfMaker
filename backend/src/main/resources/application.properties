spring.application.name=backend

# MySQL Configuration
# --------------
spring.datasource.url=jdbc:mysql://127.0.0.1:3309/db_pdfmaker?useSSL=false
spring.datasource.username=userPdfMaker#
spring.datasource.password=userPdfMaker#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# Mongodb Configuration
# --------------
spring.data.mongodb.uri=mongodb://pdf_maker_user:pdf_maker_pass@localhost:27017/pdf_maker_mongo?authSource=admin


server.port=8080
spring.security.user.name=admin
spring.security.user.password=admin

