<!-- Container principal PREMIUM -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 via-white to-blue-100 px-4 relative overflow-hidden">

  <!-- Effet background décoratif -->
  <div class="absolute w-[500px] h-[500px] bg-[#1D6FCC]/20 rounded-full blur-3xl top-[-100px] left-[-100px]"></div>
  <div class="absolute w-[400px] h-[400px] bg-[#F5A623]/20 rounded-full blur-3xl bottom-[-100px] right-[-100px]"></div>

  <!-- Carte login -->
  <div class="relative w-full max-w-md bg-white/80 backdrop-blur-2xl shadow-2xl rounded-3xl p-10 border border-white/40">

    <!-- Header -->
    <div class="text-center mb-10">
      <h1 class="text-4xl font-extrabold text-[#1D6FCC] tracking-tight">PDFMaker</h1>
      <p class="text-gray-500 mt-3 text-sm">La solution professionnelle pour gérer vos PDF</p>
    </div>

    <!-- Message erreur -->
    @if (erreur) {
      <div class="mb-6 px-4 py-3 rounded-xl bg-red-50 text-red-600 text-sm border border-red-200 flex items-center gap-2">
        <span></span>

        <span>{{ erreur }}</span>
      </div>
    }

    <!-- Formulaire -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email professionnel</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">  <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="mail"></mat-icon> </span>

          <input
            type="email"
            formControlName="email"
            class="w-full pl-10 pr-4 py-3 rounded-xl border transition outline-none bg-white/70"
            [ngClass]="{
              'border-gray-300 focus:ring-2 focus:ring-[#1D6FCC]': !loginForm.get('email')?.touched,
              'border-red-500 focus:ring-2 focus:ring-red-300': loginForm.get('email')?.invalid && loginForm.get('email')?.touched,
              'border-green-500 focus:ring-2 focus:ring-green-300': loginForm.get('email')?.valid && loginForm.get('email')?.touched
            }"
            placeholder="exemple@entreprise.com"
          />
        </div>

        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <p class="text-xs text-red-500 mt-1">Email invalide</p>
        }
      </div>

      <!-- Mot de passe -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
            <mat-icon fontIcon="lock"></mat-icon>
          </span>
          <input
            type="password"
            formControlName="motsDePasse"
            class="w-full pl-10 pr-4 py-3 rounded-xl border transition outline-none bg-white/70"
            [ngClass]="{
              'border-gray-300 focus:ring-2 focus:ring-[#1D6FCC]': !loginForm.get('motsDePasse')?.touched,
              'border-red-500 focus:ring-2 focus:ring-red-300': loginForm.get('motsDePasse')?.invalid && loginForm.get('motsDePasse')?.touched,
              'border-green-500 focus:ring-2 focus:ring-green-300': loginForm.get('motsDePasse')?.valid && loginForm.get('motsDePasse')?.touched
            }"
            placeholder="••••••••"
          />
        </div>
      </div>

      <!-- Options -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-600">
          <input type="checkbox" class="rounded border-gray-300" />
          Se souvenir de moi
        </label>
        <a href="#" class="text-[#1D6FCC] hover:underline">Mot de passe oublié ?</a>
      </div>

      <!-- Bouton -->
      <button
        type="submit"
        [disabled]="chargement || loginForm.invalid"
        class="w-full py-3 rounded-xl font-semibold text-white transition-all duration-200
               bg-[#1D6FCC] hover:bg-[#155DAD] shadow-lg hover:shadow-xl active:scale-[0.98]
               disabled:opacity-50 disabled:cursor-not-allowed">
        {{ chargement ? 'Connexion en cours...' : 'Se connecter' }}
      </button>

    </form>

    <!-- Divider -->
    <div class="my-6 flex items-center">
      <div class="flex-grow h-px bg-gray-200"></div>
      <span class="px-3 text-xs text-gray-400">ou</span>
      <div class="flex-grow h-px bg-gray-200"></div>
    </div>

    <!-- Action secondaire -->
    <div class="text-center">
      <p class="text-sm text-gray-600">
        Pas encore de compte ?
        <a routerLink="/register" class="text-[#F5A623] font-semibold hover:underline">
          Créer un compte
        </a>
      </p>
    </div>

  </div>
</div>
