<!-- Bouton Mobile (Adapté pour matcher avec le fond de l'application principal ou le vert s'il est au-dessus) -->
<button (click)="toggle()"
        type="button"
        class="md:hidden fixed top-4 left-4 z-[60] bg-[#0c1f17] border border-[#1a3327] text-white p-2.5 rounded-xl shadow-xs hover:bg-[#122b20] transition-colors cursor-pointer flex items-center justify-center">
  @if (isCollapsed()) {
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
  }
</button>

@if (!isCollapsed()) {
  <div (click)="toggle()" class="md:hidden fixed inset-0 bg-black/40 backdrop-blur-xs z-40 animate-fadeIn"></div>
}

<!-- Sidebar : Passage au Vert Sombre Émeraude de l'image `image_e8c265.png` -->
<aside [class.w-64]="!isCollapsed()"
       [class.w-21]="isCollapsed()"
       [class.translate-x-0]="!isCollapsed()"
       [class.-translate-x-full]="isCollapsed()"
       class="fixed top-0 left-0 h-screen bg-[#0c1f17] border-r border-[#152e23] flex flex-col z-50 transition-all duration-200 ease-in-out md:translate-x-0">

  <div class="px-4 py-7 w-full">
    <div class="flex items-center justify-between w-full gap-3">

      <!-- Logo toujours visible + Texte caché au collapse -->
      <div class="flex items-center gap-3 min-w-0">

        <div class="w-16 h-16 shrink-0 rounded-2xl overflow-hidden">
          <img src="assets/icone/icon-192x192.png"
               alt="Logo PDF MAKER"
               class="w-full h-full object-cover scale-[1.7]" />
        </div>


        @if (!isCollapsed()){

       <div  class="flex flex-col min-w-0 justify-center">
        <span class="text-base font-black text-white tracking-tight font-headline truncate">
          PDF MAKER
        </span>
          <span class="text-[11px] text-[#5c7a6b] font-semibold tracking-wide truncate -mt-0.5">
          Document Studio
        </span>
        </div>
        }
      </div>

      <!-- Bouton toggle -->
      <button (click)="toggle()" type="button"
              class="hidden md:flex p-1.5 rounded-lg hover:bg-white/10 text-gray-400 hover:text-white transition-colors shrink-0"
              [class.mx-auto]="isCollapsed()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
             class="w-4 h-4 transition-transform duration-150"
             [class.rotate-180]="isCollapsed()">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </button>

    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-2 space-y-1 overflow-y-auto">

    <!-- Home -->
    <a routerLink="/home" routerLinkActive="bg-white/10 !text-white"
       class="nav-item flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-[#cbd5e1] hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5 shrink-0 text-[#8fa396] group-hover:text-[#a7f3d0] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
      <span [class.hidden]="isCollapsed()" class="text-[14px] font-medium">Home</span>
    </a>

    <!-- Merge -->
    <a routerLink="/merge-pdf" routerLinkActive="bg-white/10 !text-white"
       class="nav-item flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-[#cbd5e1] hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5 shrink-0 text-[#8fa396] group-hover:text-[#a7f3d0] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
      </svg>
      <span [class.hidden]="isCollapsed()" class="text-[14px] font-medium">Merge</span>
    </a>

    <!-- Split -->
    <a routerLink="/split-pdf" routerLinkActive="bg-white/10 !text-white"
       class="nav-item flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-[#cbd5e1] hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5 shrink-0 text-[#8fa396] group-hover:text-[#a7f3d0] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
      </svg>
      <span [class.hidden]="isCollapsed()" class="text-[14px] font-medium">Split</span>
    </a>

    <!-- Convert -->
    <a routerLink="/convert" routerLinkActive="bg-white/10 !text-white"
       class="nav-item flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-[#cbd5e1] hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5 shrink-0 text-[#8fa396] group-hover:text-[#a7f3d0] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 0 0-3.7-3.7 48.678 48.678 0 0 0-7.324 0 4.006 4.006 0 0 0-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 0 0 3.7 3.7 48.656 48.656 0 0 0 7.324 0 4.006 4.006 0 0 0 3.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3-3 3" />
      </svg>
      <span [class.hidden]="isCollapsed()" class="text-[14px] font-medium">Convert</span>
    </a>

    <!-- Vault -->
    <a routerLink="/coffre-fort" routerLinkActive="bg-white/10 !text-white"
       class="nav-item flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-[#cbd5e1] hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5 shrink-0 text-[#8fa396] group-hover:text-[#a7f3d0] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25zM12 14.25v1.5" />
      </svg>
      <span [class.hidden]="isCollapsed()" class="text-[14px] font-medium">Vault</span>
    </a>

  </nav>


  <div class="p-4 border-t border-[#152e23] bg-black/10 space-y-2">
    <div class="flex items-center gap-3 px-2 py-1.5 rounded-xl bg-white/5">

      <div class="w-9 h-9 rounded-full bg-[#a7f3d0] text-[#0c1f17] flex items-center justify-center font-bold text-xs shrink-0 select-none shadow-sm">
        {{ getUserInitials() || 'JD' }}
      </div>
      <div class="flex-1 min-w-0" [class.hidden]="isCollapsed()">
        <p class="text-xs font-bold text-white truncate leading-tight">
          {{ prenom }} {{ nom }}
        </p>
      </div>
    </div>


    <button (click)="logout()" type="button" [class.justify-center]="isCollapsed()"
            class="w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition-colors group">
      <svg class="w-5 h-5 shrink-0 text-gray-500 group-hover:text-red-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 00 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
      </svg>
      <span [class.hidden]="isCollapsed()" class="text-[13px] font-medium">Se déconnecter</span>
    </button>
  </div>

</aside>
