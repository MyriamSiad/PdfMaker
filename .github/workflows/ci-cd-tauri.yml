# .github/workflows/ci-cd-tauri.yml
name: CI/CD Tauri Desktop

on:
  push:
    branches: [main]

  permissions:
    contents: write
    packages: write
env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/pdfmaker-backend
jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos

    runs-on: ${{ matrix.os }}


    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf


      - name: Build Spring Boot JAR
        run: mvn clean package -DskipTests


      - name: Copy JAR to Tauri resources
        run: |
          ls -la backend/target/*.jar
          chmod 644 backend/target/pdf-maker.jar
          mkdir -p frontend/src-tauri/resources
          cp backend/target/pdf-maker.jar frontend/src-tauri/resources/pdf-maker.jar

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: 'PdfMaker v__VERSION__'
          releaseDraft: true